# 主反向代理配置
# 处理域名 cyneblog.top

upstream backend {
    server server:8080;
}

upstream web {
    server web:80;
}

upstream admin {
    server admin:80;
}

# 博客前台 - 根路径
server {
    listen 80;
    server_name cyneblog.top www.cyneblog.top 107.173.199.221;

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 代理 (后端 context-path 为 /api)
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_Authorization;
    }

    # MinIO 对象存储代理（优先匹配）
    location ^~ /syne-blog/images/ {
        proxy_pass http://172.21.0.6:9000/syne-blog/images/;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/cyneblog-web.log;
    error_log /var/log/nginx/cyneblog-web.error.log;
}

# 管理后台 - /admin 路径
server {
    listen 80;
    server_name admin.cyneblog.top;

    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/cyneblog-admin.log;
    error_log /var/log/nginx/cyneblog-admin.error.log;
}