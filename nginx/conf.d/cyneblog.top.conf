# 主反向代理配置
# 处理域名 cyneblog.top

upstream backend {
    server server:8080;
}

upstream web {
    server web:80;
}

upstream admin {
    server admin:80;
}

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name cyneblog.top www.cyneblog.top admin.cyneblog.top;
    return 301 https://$host$request_uri;
}

# 博客前台 HTTPS
server {
    listen 443 ssl http2;
    server_name cyneblog.top www.cyneblog.top;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_Authorization;
    }

    # MinIO 图片反代：保证 HTTPS 站点同源加载，避免 Mixed Content
    # 走 docker service 名 minio:9000，比硬编码内网 IP 更稳定
    # 加 CORS 头允许跨子域 fetch 跟随 302 读取（admin.cyneblog.top → cyneblog.top）；
    # 图片为公开只读资源，使用 * 无安全风险。
    location ^~ /syne-blog/ {
        proxy_pass http://minio:9000/syne-blog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 隐藏 MinIO 上游已注入的 CORS 头，避免与下面 add_header 重复导致浏览器判定无效
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 随机封面图库桶反代（与 syne-blog 同样规则）
    location ^~ /syne-cover/ {
        proxy_pass http://minio:9000/syne-cover/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 隐藏 MinIO 上游已注入的 CORS 头，避免与下面 add_header 重复导致浏览器判定无效
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/cyneblog-web.log;
    error_log /var/log/nginx/cyneblog-web.error.log;
}

# 管理后台 HTTPS
server {
    listen 443 ssl http2;
    server_name admin.cyneblog.top;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    access_log /var/log/nginx/cyneblog-admin.log;
    error_log /var/log/nginx/cyneblog-admin.error.log;
}
