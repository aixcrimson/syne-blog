spring:
  # 生产环境数据源配置(通过环境变量覆盖)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/syne_blog}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis 配置（External URL 需要 SSL）
  data:
    redis:
      ssl:
        enabled: true

# MyBatis-Plus 配置（生产环境关闭SQL日志）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 日志级别（生产环境减少日志输出）
logging:
  level:
    com.syne.server: info
    com.baomidou.mybatisplus: warn
    org.springframework.security: warn
