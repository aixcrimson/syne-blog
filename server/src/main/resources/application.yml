spring:
  application:
    name: syne-blog-server

  # 激活的 profile
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/syne_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: postgres
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰命名转换
    map-underscore-to-camel-case: true
    # 懒加载
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # mapper xml 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.syne.server.entity

# JWT 配置
jwt:
  secret: your-secret-key-change-this-in-production-at-least-256-bits
  expiration: 86400 # 24小时，单位秒
  header: Authorization
  prefix: Bearer

auth:
  token:
    blacklist-prefix: "auth:blacklist:"
    blacklist-ttl-seconds: 0

navigation:
  cache:
    key-prefix: "navigation:"
    ttl-seconds: 300

# MinIO 对象存储配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://107.173.199.221:9000}
  # 避免 HTTPS 页面加载 HTTP 图片时被浏览器以 Mixed Content 拦截。留空回退到 endpoint。
  public-url: ${MINIO_PUBLIC_URL:}
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:minio123456}
  bucket-name: ${MINIO_BUCKET:syne-blog}
  # 随机封面图库存储桶
  cover-bucket: ${MINIO_COVER_BUCKET:syne-cover}
  # 图片允许的类型
  allowed-types: image/jpeg,image/png,image/gif,image/webp
  # 最大文件大小 (单位: MB)
  max-size: 10

# Spring AI OpenAI 配置（支持中转站）
spring.ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-ai-v1-a0fee99102993a5122412257433d7fead732bccc5a87bac8b5ae64babe82e9d6}
    base-url: ${OPENAI_BASE_URL:https://zenmux.ai/api}
    chat:
      options:
        model: ${OPENAI_MODEL:deepseek/deepseek-v4-flash-free}
        temperature: 0.7
        max-tokens: 2000
    embedding:
      options:
        model: text-embedding-ada-002
  vectorstore:
    pgvector:
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      dimensions: 1536
      table-name: article_embeddings

# AI 功能配置
ai:
  enabled: true
  rag:
    enabled: false
    top-k: 5
    similarity-threshold: 0.7

# 服务器配置
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 日志配置
logging:
  level:
    com.syne.server: debug
    com.baomidou.mybatisplus: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
